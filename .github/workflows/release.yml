name: Build and release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Never run two publications at the same time; queued pushes wait for the previous one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  publish:
    name: Publish new version
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and the GitHub Release
      packages: write   # publish to GitHub Packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # writes ~/.m2/settings.xml with the "github" server used by <distributionManagement>
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve version
        id: version
        run: |
          base=$(mvn -B -ntp -q help:evaluate -Dexpression=revision -DforceStdout)
          major_minor=$(echo "$base" | cut -d. -f1-2)
          version="${major_minor}.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

      - name: Publish to GitHub Packages
        run: >
          mvn -B -ntp deploy -DskipTests
          -Drevision=${{ steps.version.outputs.version }}
          -Dgithub.repository=${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          target/*.jar
          --target "${{ github.sha }}"
          --title "v${{ steps.version.outputs.version }}"
          --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
